metadata:
  title: "设计数据密集型应用"
  description: |
    围绕《Designing Data-Intensive Applications》（DDIA）的系列播客。
    从「云原生分布式 vs 单机极简」谈起，梳理架构权衡、数据模型与存储选型背后的取舍逻辑，
    帮你把书里的原则接到真实系统设计决策上。
  link: "https://eighthundreds.github.io/Podcast/"
  rss_feed_url: "https://eighthundreds.github.io/Podcast/feed.xml"
  language: "zh-cn"
  author: "主持人"
  email: "mingoing@outlook.com"
  image: "https://eighthundreds.github.io/Podcast/cover.png"
  category: "Technology"
  explicit: false
  copyright: "© 2026 设计数据密集型应用"
  podcast_guid: "17ebeeff-5ba2-464b-a65e-f06ac2b1ad11"
  podcast_locked: "no"

