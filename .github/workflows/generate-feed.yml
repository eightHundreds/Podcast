name: Generate Podcast Feed

on:
  push:
    branches: [main, master]
    paths:
      - "shows.yaml"
      - "shows/**"
      - "scripts/**"
      - "docs/**"
      - ".github/workflows/generate-feed.yml"
  pull_request:
    paths:
      - "shows.yaml"
      - "shows/**"
      - "scripts/**"
      - "docs/assets/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # 站点/feed 生成与单测只需 PyYAML + pytest（转写用 mlx-audio 不进 CI）
        run: pip install "PyYAML>=6.0.1" "pytest>=8.0.0"

      - name: Validate configs
        run: python scripts/generate_all.py --dry-run --include-future

      - name: Generate feeds + site pages
        run: python scripts/generate_all.py --include-future

      - name: Unit tests
        run: python -m pytest tests/ -q

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    if: github.event_name != 'pull_request'
    needs: generate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
